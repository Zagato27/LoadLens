# Bundles: packs that usually go together for one stack. The UI applies them pack by pack, so each
# pack keeps its own variables and check.

[[bundles]]
id = "spring-k8s-k6-influxdb"
title = "Spring Boot на Kubernetes + k6 (InfluxDB)"
description = "Java-сервисы на Micrometer, PostgreSQL и Kafka в Kubernetes, нагрузка k6 с выводом в InfluxDB 1.x."
packs = ["lt-k6-influxql", "jvm-micrometer", "http-micrometer", "db-hikaricp", "db-postgres-exporter", "kafka-exporter", "node-exporter", "k8s-nodes", "k8s-workload-health"]

[[bundles]]
id = "spring-vm-jmeter"
title = "Spring Boot на виртуальных машинах + JMeter"
description = "Java-сервисы на Micrometer и PostgreSQL на VM, нагрузка JMeter с Backend Listener в InfluxDB."
packs = ["lt-jmeter-influxql", "jvm-micrometer", "http-micrometer", "db-hikaricp", "db-postgres-exporter", "node-exporter"]

[[bundles]]
id = "java-jmx-gatling"
title = "Java с JMX exporter + Gatling"
description = "JVM-сервисы с javaagent JMX exporter, брокеры Kafka через JMX, нагрузка Gatling через Graphite в InfluxDB."
packs = ["lt-gatling-influxql", "jvm-jmx-exporter", "http-otel", "kafka-broker-jmx", "node-exporter"]

[[bundles]]
id = "go-k8s-k6-prometheus"
title = "Go на Kubernetes + k6 (Prometheus remote write)"
description = "Go-сервисы на client_golang с PostgreSQL в Kubernetes, нагрузка k6 с выводом в Prometheus."
packs = ["lt-k6-prometheus-rw", "runtime-go", "http-go", "db-postgres-exporter", "node-exporter", "k8s-nodes", "k8s-workload-health"]

[[bundles]]
id = "python-k8s-k6-prometheus"
title = "Python (FastAPI) на Kubernetes + k6 (Prometheus remote write)"
description = "Сервисы FastAPI с PostgreSQL в Kubernetes: CPU и память от лимитов контейнеров, нагрузка k6 в Prometheus."
packs = ["lt-k6-prometheus-rw", "k8s-workload-cpu", "http-python-fastapi", "db-postgres-exporter", "node-exporter", "k8s-nodes", "k8s-workload-health"]
