schema_version = 1
id = "host-windows-exporter"
version = 1
title = "Хосты компонента Windows: windows_exporter (БД, Kafka, рантайм)"
title_en = "Windows component hosts: windows_exporter (database, Kafka, runtime)"
category = "infrastructure"
stack = ["windows"]
domains = ["database", "kafka", "jvm", "microservices"]
max_instances = 10
instance_variable = "host_title"
language = "promql"
description = """
Ресурсы Windows-серверов, на которых работает компонент раздела (например, SQL Server): CPU, память, очередь \
процессора на ядро, загрузка и заполнение дисков, сеть из prometheus-community/windows_exporter попадают в \
раздел выбранного домена. Домен выбирается при установке; в одном домене до 10 установок, их различает \
название хостов. SLA по CPU и памяти узлов эти ряды не читает. Узел называется по адресу instance без порта.
"""
description_en = """
Resources of the Windows servers a component of the section runs on (SQL Server, for example): CPU, memory, \
processor queue per core, disk utilization and fill, network from prometheus-community/windows_exporter land \
in the section of the chosen domain. The domain is picked at install time; one domain takes up to 10 \
installations told apart by the host title. The node CPU and memory SLA does not read these series. A node is \
named by the instance address without the port.
"""
requires_metrics = ["windows_cpu_time_total", "windows_logical_disk_free_bytes"]
prompt_addendum = """
Ресурсы Windows-хостов компонента (подписи начинаются с названия хостов): CPU % — доля не-idle времени всех \
ядер, очередь процессора на ядро выше 2 — потоки ждут CPU, загрузка диска — доля времени, когда том не \
простаивает. Это хосты компонента этого раздела, а не узлы приложения.
"""
prompt_addendum_en = """
Resources of the component's Windows hosts (labels start with the host title): CPU % is the non-idle share of \
all cores, a processor queue per core above 2 means threads wait for CPU, disk utilization is the share of \
time the volume is not idle. These are the hosts of this section's component, not the application nodes.
"""

[variables.host_title]
title = "Название хостов"
title_en = "Host title"
default = "Windows host"
pattern = '^\w[\w .()/-]{0,31}$'
help = "Начало подписей рядов, например «SQL Server». Разные названия — разные установки пакета в домене."
help_en = 'Start of the series labels, for example "SQL Server". Different titles are different installations of the pack in the domain.'

[variables.matchers]
title = "Матчеры хостов"
title_en = "Host matchers"
default = ""
help = "Только хосты этого компонента, например job=\"windows\", instance=~\"sql-.*\"."
help_en = 'Only the hosts of this component, for example job="windows", instance=~"sql-.*".'

[variables.window]
title = "Окно rate()"
title_en = "rate() window"
default = "2m"
pattern = '^[1-9][0-9]*[smh]$'

[[queries]]
label = "{{host_title}}: CPU usage (%) by node"
role = "host.cpu_pct"
unit = "percent"
required = true
query = 'label_replace(100 * (1 - avg by (instance) (rate(windows_cpu_time_total{mode="idle", {{matchers}} }[{{window}}]))), "node", "$1", "instance", "([^:]+).*")'
keys = ["node"]
description = "CPU хоста, %."
description_en = "Host CPU, %."

[[queries]]
label = "{{host_title}}: Memory usage (%) by node"
role = "host.mem_pct"
unit = "percent"
required = true
query = 'label_replace(100 * (1 - max by (instance) (windows_os_physical_memory_free_bytes{ {{matchers}} } or windows_memory_physical_free_bytes{ {{matchers}} }) / max by (instance) (windows_cs_physical_memory_bytes{ {{matchers}} } or windows_memory_physical_total_bytes{ {{matchers}} })), "node", "$1", "instance", "([^:]+).*")'
keys = ["node"]
description = "Занятая физическая память, %."
description_en = "Used physical memory, %."

[[queries]]
label = "{{host_title}}: processor queue per core by node"
role = "host.load_per_core"
unit = "ratio"
query = 'label_replace(max by (instance) (windows_system_processor_queue_length{ {{matchers}} }) / count by (instance) (windows_cpu_time_total{mode="idle", {{matchers}} }), "node", "$1", "instance", "([^:]+).*")'
keys = ["node"]
description = "Потоки в очереди к процессору на одно ядро."
description_en = "Threads queued for the processor per core."

[[queries]]
label = "{{host_title}}: Disk utilization of the busiest volume (%) by node"
role = "host.disk_util_pct"
unit = "percent"
query = 'label_replace(100 * (1 - min by (instance) (rate(windows_logical_disk_idle_seconds_total{volume!~"HarddiskVolume.*", {{matchers}} }[{{window}}]))), "node", "$1", "instance", "([^:]+).*")'
keys = ["node"]
description = "Доля времени, когда самый занятый том не простаивает, %."
description_en = "Share of time the busiest volume is not idle, %."

[[queries]]
label = "{{host_title}}: Network receive (bytes/s) by node"
role = "host.net_rx"
unit = "bytes_per_second"
query = 'label_replace(sum by (instance) (rate(windows_net_bytes_received_total{nic!~".*(Loopback|isatap).*", {{matchers}} }[{{window}}])), "node", "$1", "instance", "([^:]+).*")'
keys = ["node"]
description = "Входящий трафик."
description_en = "Incoming traffic."

[[queries]]
label = "{{host_title}}: Network transmit (bytes/s) by node"
role = "host.net_tx"
unit = "bytes_per_second"
query = 'label_replace(sum by (instance) (rate(windows_net_bytes_sent_total{nic!~".*(Loopback|isatap).*", {{matchers}} }[{{window}}])), "node", "$1", "instance", "([^:]+).*")'
keys = ["node"]
description = "Исходящий трафик."
description_en = "Outgoing traffic."

[[queries]]
label = "{{host_title}}: Disk used (%) by node"
role = "host.fs_used_pct"
unit = "percent"
query = 'label_replace(100 * max by (instance) (1 - windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*", {{matchers}} } / windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*", {{matchers}} }), "node", "$1", "instance", "([^:]+).*")'
keys = ["node"]
description = "Заполнение самого занятого тома, %."
description_en = "Fill of the fullest volume, %."
