schema_version = 1
id = "http-go"
version = 1
title = "HTTP и gRPC: Go (promhttp, go-grpc-prometheus)"
category = "http"
stack = ["go"]
domain = "microservices"
language = "promql"
verified = true
description = """
HTTP-гистограмма, которую Go-сервисы обычно регистрируют через promhttp.InstrumentHandlerDuration \
(по умолчанию http_request_duration_seconds с лейблами handler и code — имена задаются в переменных), \
и серверные метрики gRPC из go-grpc-prometheus / go-grpc-middleware (grpc_server_handled_total, \
grpc_server_handling_seconds — гистограмма включается EnableHandlingTimeHistogram).
"""
requires_metrics = ["http_request_duration_seconds_count", "grpc_server_handled_total"]
prompt_addendum = """
Метрики Go-сервиса: гистограмма HTTP по маршруту (handler) и коду ответа (code), \
grpc_server_handled_total — завершённые gRPC-вызовы по grpc_method и grpc_code (OK — успех), \
grpc_server_handling_seconds — время обработки gRPC. Времена в секундах.
"""

[variables.service_label]
title = "Лейбл с именем сервиса"
default = "job"
pattern = '^[a-zA-Z_][a-zA-Z0-9_]*$'

[variables.matchers]
title = "Дополнительные матчеры"
default = ""

[variables.metric_prefix]
title = "Имя HTTP-гистограммы"
default = "http_request_duration_seconds"
pattern = '^[a-zA-Z_:][a-zA-Z0-9_:]*$'

[variables.route_label]
title = "Лейбл маршрута"
default = "handler"
pattern = '^[a-zA-Z_][a-zA-Z0-9_]*$'

[variables.status_label]
title = "Лейбл кода ответа"
default = "code"
pattern = '^[a-zA-Z_][a-zA-Z0-9_]*$'

[variables.window]
title = "Окно rate()"
default = "1m"
pattern = '^[1-9][0-9]*[smh]$'

[[queries]]
label = "HTTP (Go): request rate (RPS) by service"
role = "http.rps"
unit = "per_second"
required = true
query = 'sum by ({{service_label}}) (rate({{metric_prefix}}_count{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}"]
description = "Входящие HTTP-запросы в секунду."

[[queries]]
label = "HTTP (Go): average request time (sec) by service"
role = "http.avg_latency"
unit = "seconds"
query = 'sum by ({{service_label}}) (rate({{metric_prefix}}_sum{ {{service_label}}!="", {{matchers}} }[{{window}}])) / sum by ({{service_label}}) (rate({{metric_prefix}}_count{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}"]
description = "Среднее время обработки, с."

[[queries]]
label = "HTTP (Go): p95 request time (sec) by service"
role = "http.p95"
unit = "seconds"
query = 'histogram_quantile(0.95, sum by (le, {{service_label}}) (rate({{metric_prefix}}_bucket{ {{service_label}}!="", {{matchers}} }[{{window}}])))'
keys = ["{{service_label}}"]
description = "p95 времени обработки, с."

[[queries]]
label = "HTTP (Go): 5xx error rate (%) by service"
role = "http.error_rate_pct"
unit = "percent"
query = '100 * (sum by ({{service_label}}) (rate({{metric_prefix}}_count{ {{status_label}}=~"5..", {{service_label}}!="", {{matchers}} }[{{window}}])) or 0 * sum by ({{service_label}}) (rate({{metric_prefix}}_count{ {{service_label}}!="", {{matchers}} }[{{window}}]))) / sum by ({{service_label}}) (rate({{metric_prefix}}_count{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}"]
description = "Доля ответов 5xx, %."

[[queries]]
label = "HTTP (Go): RPS by service & route (top 20)"
role = "http.rps_by_route"
unit = "per_second"
query = 'topk(20, sum by ({{service_label}}, {{route_label}}) (rate({{metric_prefix}}_count{ {{service_label}}!="", {{matchers}} }[{{window}}])))'
keys = ["{{service_label}}", "{{route_label}}"]
description = "Самые нагруженные маршруты."

[[queries]]
label = "HTTP (Go): p95 request time (sec) by service & route (top 20)"
role = "http.p95_by_route"
unit = "seconds"
query = 'topk(20, histogram_quantile(0.95, sum by (le, {{service_label}}, {{route_label}}) (rate({{metric_prefix}}_bucket{ {{service_label}}!="", {{matchers}} }[{{window}}]))))'
keys = ["{{service_label}}", "{{route_label}}"]
description = "Самые медленные маршруты по p95."

[[queries]]
label = "gRPC (Go): calls per second by service"
role = "grpc.rps"
unit = "per_second"
query = 'sum by ({{service_label}}) (rate(grpc_server_handled_total{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}"]
description = "Завершённые gRPC-вызовы в секунду."

[[queries]]
label = "gRPC (Go): error rate (%) by service"
role = "grpc.error_rate_pct"
unit = "percent"
query = '100 * (sum by ({{service_label}}) (rate(grpc_server_handled_total{grpc_code!="OK", {{service_label}}!="", {{matchers}} }[{{window}}])) or 0 * sum by ({{service_label}}) (rate(grpc_server_handled_total{ {{service_label}}!="", {{matchers}} }[{{window}}]))) / sum by ({{service_label}}) (rate(grpc_server_handled_total{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}"]
description = "Доля gRPC-вызовов с кодом, отличным от OK, %."

[[queries]]
label = "gRPC (Go): p95 handling time (sec) by service"
role = "grpc.p95"
unit = "seconds"
query = 'histogram_quantile(0.95, sum by (le, {{service_label}}) (rate(grpc_server_handling_seconds_bucket{ {{service_label}}!="", {{matchers}} }[{{window}}])))'
keys = ["{{service_label}}"]
description = "p95 обработки gRPC, с. Нужна гистограмма времени обработки."
