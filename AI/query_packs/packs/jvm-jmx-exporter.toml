schema_version = 1
id = "jvm-jmx-exporter"
version = 1
title = "JVM: Prometheus JMX exporter, client_java"
category = "runtime"
stack = ["java", "jmx"]
domain = "jvm"
language = "promql"
domain_title = "JVM"
description = """
JVM-метрики Prometheus client_java (hotspot exports) — их отдают javaagent JMX exporter, приложения на \
simpleclient и Dropwizard-мосты. Подходят имена client_java 0.x (jvm_memory_bytes_used) и 1.x \
(jvm_memory_used_bytes). CPU процесса приходит в ядрах: укажите лимит CPU контейнера или число ядер, \
чтобы получить долю 0..1.
"""
description_en = """
JVM metrics of the Prometheus client_java (hotspot exports), exposed by the JMX exporter javaagent, \
simpleclient applications and Dropwizard bridges. Works with the names of client_java 0.x \
(jvm_memory_bytes_used) and 1.x (jvm_memory_used_bytes). Process CPU comes in cores: set the container CPU \
limit or the number of cores to get a 0..1 fraction.
"""
requires_metrics = ["jvm_threads_current", "jvm_gc_collection_seconds_count", "process_cpu_seconds_total"]
prompt_addendum = """
Метрики client_java: jvm_memory_bytes_used / jvm_memory_used_bytes{area="heap"} — занятая куча, \
jvm_gc_collection_seconds — время сборок по сборщикам (gc), jvm_threads_current — потоки, \
process_cpu_seconds_total — CPU процесса, в отчёте пересчитан в долю от заданного числа ядер.
"""
prompt_addendum_en = """
client_java metrics: jvm_memory_bytes_used / jvm_memory_used_bytes{area="heap"} is the used heap, \
jvm_gc_collection_seconds is the collection time by collector (gc), jvm_threads_current is threads, \
process_cpu_seconds_total is process CPU, which the report converts into a fraction of the given number of \
cores.
"""

[variables.service_label]
title = "Лейбл с именем сервиса"
title_en = "Label with the service name"
default = "job"
pattern = '^[a-zA-Z_][a-zA-Z0-9_]*$'

[variables.matchers]
title = "Дополнительные матчеры"
title_en = "Extra matchers"
default = ""
help = 'Например job=~"orders|payments".'
help_en = 'For example job=~"orders|payments".'

[variables.cpu_limit_cores]
title = "Ядер на экземпляр"
title_en = "Cores per instance"
default = "1"
pattern = '^[0-9]+(\.[0-9]+)?$'
help = "Лимит CPU контейнера или число ядер хоста: CPU процесса делится на это число."
help_en = "Container CPU limit or the number of host cores: process CPU is divided by this number."

[variables.window]
title = "Окно rate()"
title_en = "rate() window"
default = "2m"
pattern = '^[1-9][0-9]*[smh]$'

[sla]
service_cpu_query = "@runtime.cpu"

[[queries]]
label = "JVM (JMX exporter): Heap used (bytes) by ({{service_label}}, instance)"
role = "runtime.heap_used"
unit = "bytes"
required = true
query = 'sum by ({{service_label}}, instance) (jvm_memory_bytes_used{area="heap", {{service_label}}!="", {{matchers}} } or jvm_memory_used_bytes{area="heap", {{service_label}}!="", {{matchers}} })'
keys = ["{{service_label}}", "instance"]
description = "Занятая куча экземпляра."
description_en = "Used heap of an instance."

[[queries]]
label = "JVM (JMX exporter): Heap max (bytes) by ({{service_label}}, instance)"
role = "runtime.heap_max"
unit = "bytes"
query = 'sum by ({{service_label}}, instance) (jvm_memory_bytes_max{area="heap", {{service_label}}!="", {{matchers}} } > 0 or jvm_memory_max_bytes{area="heap", {{service_label}}!="", {{matchers}} } > 0)'
keys = ["{{service_label}}", "instance"]
description = "Максимум кучи."
description_en = "Maximum heap."

[[queries]]
label = "JVM (JMX exporter): Process CPU (share of limit) by ({{service_label}}, instance)"
role = "runtime.cpu"
unit = "fraction"
required = true
query = '(sum by ({{service_label}}, instance) (rate(process_cpu_seconds_total{ {{service_label}}!="", {{matchers}} }[{{window}}])) / {{cpu_limit_cores}}) and on ({{service_label}}, instance) (jvm_threads_current{ {{service_label}}!="", {{matchers}} } or jvm_threads_live_threads{ {{service_label}}!="", {{matchers}} })'
keys = ["{{service_label}}", "instance"]
description = "CPU процесса JVM как доля 0..1 от заданного числа ядер. Процессы без JVM-метрик отбрасываются."
description_en = "JVM process CPU as a 0..1 fraction of the given number of cores. Processes without JVM metrics are dropped."

[[queries]]
label = "JVM (JMX exporter): GC time (%) by ({{service_label}}, instance)"
role = "runtime.gc_time_pct"
unit = "percent"
query = '100 * sum by ({{service_label}}, instance) (rate(jvm_gc_collection_seconds_sum{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}", "instance"]
description = "Доля времени в сборках мусора, %."
description_en = "Share of time spent in garbage collection, %."

[[queries]]
label = "JVM (JMX exporter): GC collection avg (s) by ({{service_label}}, instance)"
role = "runtime.gc_pause_avg"
unit = "seconds"
query = 'sum by ({{service_label}}, instance) (rate(jvm_gc_collection_seconds_sum{ {{service_label}}!="", {{matchers}} }[{{window}}])) / sum by ({{service_label}}, instance) (rate(jvm_gc_collection_seconds_count{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}", "instance"]
description = "Средняя длительность сборки, с."
description_en = "Average collection duration, s."

[[queries]]
label = "JVM (JMX exporter): GC collections per second by ({{service_label}}, instance)"
role = "runtime.gc_rate"
unit = "per_second"
query = 'sum by ({{service_label}}, instance) (rate(jvm_gc_collection_seconds_count{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}", "instance"]
description = "Частота сборок мусора."
description_en = "Garbage collection rate."

[[queries]]
label = "JVM (JMX exporter): Threads by ({{service_label}}, instance)"
role = "runtime.threads"
unit = "count"
query = 'sum by ({{service_label}}, instance) (jvm_threads_current{ {{service_label}}!="", {{matchers}} })'
keys = ["{{service_label}}", "instance"]
description = "Потоки JVM."
description_en = "JVM threads."
