schema_version = 1
id = "http-nginx-ingress"
version = 1
title = "HTTP: ingress-nginx"
category = "http"
stack = ["kubernetes", "nginx"]
domain = "microservices"
language = "promql"
description = """
Метрики контроллера ingress-nginx: запросы и время ответа по ingress, а также время ответа апстрима \
(сервиса за ingress). Разница между ними — время самого ingress и сети.
"""
description_en = """
ingress-nginx controller metrics: requests and response time by ingress plus the upstream response time (the \
service behind the ingress). The difference between them is the time of the ingress itself and the network.
"""
requires_metrics = ["nginx_ingress_controller_requests", "nginx_ingress_controller_request_duration_seconds_bucket"]
prompt_addendum = """
Метрики ingress-nginx: request_duration — полное время запроса на ingress, response_duration — время \
ответа апстрима. Если растёт первое при стабильном втором, узкое место в ingress (CPU, соединения), а не \
в сервисе.
"""
prompt_addendum_en = """
ingress-nginx metrics: request_duration is the full request time on the ingress, response_duration is the \
upstream response time. If the first grows while the second stays flat, the bottleneck is the ingress (CPU, \
connections), not the service.
"""

[variables.service_label]
title = "Лейбл с именем сервиса"
title_en = "Label with the service name"
default = "ingress"
pattern = '^[a-zA-Z_][a-zA-Z0-9_]*$'
help = "ingress, service или host."
help_en = "ingress, service or host."

[variables.matchers]
title = "Дополнительные матчеры"
title_en = "Extra matchers"
default = ""
help = 'Например namespace="shop".'
help_en = 'For example namespace="shop".'

[variables.window]
title = "Окно rate()"
title_en = "rate() window"
default = "1m"
pattern = '^[1-9][0-9]*[smh]$'

[[queries]]
label = "HTTP (ingress-nginx): request rate (RPS) by ingress"
role = "http.rps"
unit = "per_second"
required = true
query = 'sum by ({{service_label}}) (rate(nginx_ingress_controller_requests{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}"]
description = "Запросы в секунду через ingress."
description_en = "Requests per second through the ingress."

[[queries]]
label = "HTTP (ingress-nginx): average request time (sec) by ingress"
role = "http.avg_latency"
unit = "seconds"
query = 'sum by ({{service_label}}) (rate(nginx_ingress_controller_request_duration_seconds_sum{ {{service_label}}!="", {{matchers}} }[{{window}}])) / sum by ({{service_label}}) (rate(nginx_ingress_controller_request_duration_seconds_count{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}"]
description = "Среднее полное время запроса на ingress, с."
description_en = "Average full request time on the ingress, s."

[[queries]]
label = "HTTP (ingress-nginx): p95 request time (sec) by ingress"
role = "http.p95"
unit = "seconds"
query = 'histogram_quantile(0.95, sum by (le, {{service_label}}) (rate(nginx_ingress_controller_request_duration_seconds_bucket{ {{service_label}}!="", {{matchers}} }[{{window}}])))'
keys = ["{{service_label}}"]
description = "p95 полного времени запроса, с."
description_en = "p95 of the full request time, s."

[[queries]]
label = "HTTP (ingress-nginx): 5xx error rate (%) by ingress"
role = "http.error_rate_pct"
unit = "percent"
query = '100 * (sum by ({{service_label}}) (rate(nginx_ingress_controller_requests{status=~"5..", {{service_label}}!="", {{matchers}} }[{{window}}])) or 0 * sum by ({{service_label}}) (rate(nginx_ingress_controller_requests{ {{service_label}}!="", {{matchers}} }[{{window}}]))) / sum by ({{service_label}}) (rate(nginx_ingress_controller_requests{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}"]
description = "Доля ответов 5xx, %."
description_en = "Share of 5xx responses, %."

[[queries]]
label = "HTTP (ingress-nginx): RPS by ingress & path (top 20)"
role = "http.rps_by_route"
unit = "per_second"
query = 'topk(20, sum by ({{service_label}}, path) (rate(nginx_ingress_controller_requests{ {{service_label}}!="", {{matchers}} }[{{window}}])))'
keys = ["{{service_label}}", "path"]
description = "Самые нагруженные пути."
description_en = "Busiest paths."

[[queries]]
label = "HTTP (ingress-nginx): upstream average response time (sec) by ingress"
role = "http.client_avg_latency"
unit = "seconds"
query = 'sum by ({{service_label}}) (rate(nginx_ingress_controller_response_duration_seconds_sum{ {{service_label}}!="", {{matchers}} }[{{window}}])) / sum by ({{service_label}}) (rate(nginx_ingress_controller_response_duration_seconds_count{ {{service_label}}!="", {{matchers}} }[{{window}}]))'
keys = ["{{service_label}}"]
description = "Среднее время ответа апстрима (сервиса за ingress), с."
description_en = "Average upstream response time (the service behind the ingress), s."
