schema_version = 1
id = "http-istio"
version = 1
title = "HTTP: Istio service mesh"
category = "http"
stack = ["kubernetes", "istio"]
domain = "microservices"
language = "promql"
description = """
Стандартные метрики Istio (Envoy-сайдкары): istio_requests_total и гистограмма \
istio_request_duration_milliseconds. Подходят для сервисов на любом языке без инструментации кода. \
reporter="destination" — метрики принимающей стороны, "source" — вызывающей. Время переводится в секунды.
"""
requires_metrics = ["istio_requests_total", "istio_request_duration_milliseconds_bucket"]
prompt_addendum = """
Метрики Istio снимает Envoy-сайдкар: время включает работу сайдкара и сети между подами. \
Ряды «source → destination» — вызовы между сервисами; рост p95 у вызываемого сервиса раньше, чем у \
вызывающего, указывает на узкое место ниже по цепочке.
"""

[variables.service_label]
title = "Лейбл с именем сервиса"
default = "destination_workload"
pattern = '^[a-zA-Z_][a-zA-Z0-9_]*$'
help = "destination_workload, destination_service_name или destination_app."

[variables.reporter]
title = "Сторона измерения"
default = "destination"
choices = ["destination", "source"]

[variables.namespace]
title = "Namespace (регулярное выражение)"
default = ".+"
pattern = '^[^"\n\r{}]*$'

[variables.window]
title = "Окно rate()"
default = "1m"
pattern = '^[1-9][0-9]*[smh]$'

[[queries]]
label = "HTTP (Istio): request rate (RPS) by workload"
role = "http.rps"
unit = "per_second"
required = true
query = 'sum by ({{service_label}}) (rate(istio_requests_total{reporter="{{reporter}}", destination_workload_namespace=~"{{namespace}}", {{service_label}}!=""}[{{window}}]))'
keys = ["{{service_label}}"]
description = "Входящие запросы в секунду."

[[queries]]
label = "HTTP (Istio): average request time (sec) by workload"
role = "http.avg_latency"
unit = "seconds"
query = 'sum by ({{service_label}}) (rate(istio_request_duration_milliseconds_sum{reporter="{{reporter}}", destination_workload_namespace=~"{{namespace}}", {{service_label}}!=""}[{{window}}])) / sum by ({{service_label}}) (rate(istio_request_duration_milliseconds_count{reporter="{{reporter}}", destination_workload_namespace=~"{{namespace}}", {{service_label}}!=""}[{{window}}])) / 1000'
keys = ["{{service_label}}"]
description = "Среднее время запроса, с."

[[queries]]
label = "HTTP (Istio): p95 request time (sec) by workload"
role = "http.p95"
unit = "seconds"
query = 'histogram_quantile(0.95, sum by (le, {{service_label}}) (rate(istio_request_duration_milliseconds_bucket{reporter="{{reporter}}", destination_workload_namespace=~"{{namespace}}", {{service_label}}!=""}[{{window}}]))) / 1000'
keys = ["{{service_label}}"]
description = "p95 времени запроса, с."

[[queries]]
label = "HTTP (Istio): 5xx error rate (%) by workload"
role = "http.error_rate_pct"
unit = "percent"
query = '100 * (sum by ({{service_label}}) (rate(istio_requests_total{response_code=~"5..", reporter="{{reporter}}", destination_workload_namespace=~"{{namespace}}", {{service_label}}!=""}[{{window}}])) or 0 * sum by ({{service_label}}) (rate(istio_requests_total{reporter="{{reporter}}", destination_workload_namespace=~"{{namespace}}", {{service_label}}!=""}[{{window}}]))) / sum by ({{service_label}}) (rate(istio_requests_total{reporter="{{reporter}}", destination_workload_namespace=~"{{namespace}}", {{service_label}}!=""}[{{window}}]))'
keys = ["{{service_label}}"]
description = "Доля ответов 5xx, %."

[[queries]]
label = "HTTP (Istio): RPS by source & destination workload (top 20)"
role = "http.rps_by_route"
unit = "per_second"
query = 'topk(20, sum by (source_workload, destination_workload) (rate(istio_requests_total{reporter="{{reporter}}", destination_workload_namespace=~"{{namespace}}"}[{{window}}])))'
keys = ["source_workload", "destination_workload"]
description = "Вызовы между сервисами."

[[queries]]
label = "HTTP (Istio): p95 request time (sec) by source & destination workload (top 20)"
role = "http.p95_by_route"
unit = "seconds"
query = 'topk(20, histogram_quantile(0.95, sum by (le, source_workload, destination_workload) (rate(istio_request_duration_milliseconds_bucket{reporter="{{reporter}}", destination_workload_namespace=~"{{namespace}}"}[{{window}}]))) / 1000)'
keys = ["source_workload", "destination_workload"]
description = "Самые медленные вызовы между сервисами по p95."
