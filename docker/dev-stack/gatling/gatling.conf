# Dev-stack Gatling settings: everything else comes from the defaults inside the bundle.
gatling {
  data {
    writers = [console, graphite]
    enableAnalytics = false
    graphite {
      host = "victoriametrics"
      port = 2003
      protocol = "tcp"
      rootPathPrefix = "gatling"
      writePeriod = 1
    }
  }
}
