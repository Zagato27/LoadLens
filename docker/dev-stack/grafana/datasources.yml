apiVersion: 1

datasources:
  - name: Prometheus
    uid: devstack-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: InfluxDB-k6
    uid: devstack-influx-k6
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: k6
    jsonData:
      dbName: k6
      httpMode: GET
