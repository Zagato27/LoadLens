services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ltar_timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Unprivileged role the application connects with (initdb/03_app_role.sh); empty keeps POSTGRES_USER.
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    ports:
      # Loopback only: the app reaches the database over the compose network. Set TSDB_BIND=0.0.0.0
      # in docker/.env only if another host really has to connect to the database directly.
      - "${TSDB_BIND:-127.0.0.1}:${TSDB_PORT:-5432}:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: ltar_redis
    environment:
      # Celery messages and results pass through Redis, so it must not accept unauthenticated clients.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/.env}
      # Lets redis-cli (healthcheck, manual checks) authenticate without the password in its arguments.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --save 20 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512m}
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ltar_app
    depends_on:
      - timescaledb
      - redis
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      # Приложение по умолчанию читает настройки TimescaleDB из settings.py
      # The broker URL carries the Redis password: keep REDIS_PASSWORD URL-safe (openssl rand -hex 32).
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-0}
      # Authentication (see docker/env.example). Empty values fall back to settings.py.
      LOADLENS_AUTH_ENABLED: ${LOADLENS_AUTH_ENABLED:-1}
      LOADLENS_SECRET_KEY: ${LOADLENS_SECRET_KEY:-}
      LOADLENS_ADMIN_USER: ${LOADLENS_ADMIN_USER:-}
      LOADLENS_ADMIN_PASSWORD: ${LOADLENS_ADMIN_PASSWORD:-}
      LOADLENS_RECOVERY_USER: ${LOADLENS_RECOVERY_USER:-}
      LOADLENS_RECOVERY_PASSWORD_HASH: ${LOADLENS_RECOVERY_PASSWORD_HASH:-}
      LOADLENS_COOKIE_SECURE: ${LOADLENS_COOKIE_SECURE:-}
      LOADLENS_TRUSTED_PROXIES: ${LOADLENS_TRUSTED_PROXIES:-}
      # Gives ids to runs saved before ids existed, once, in the background (python -m loadlens_app.migrations).
      LOADLENS_RUN_MIGRATIONS: ${LOADLENS_RUN_MIGRATIONS:-1}
      # Watches load tests started from the UI right after a restart (0 switches the watcher off).
      LOADLENS_LOAD_TEST_WATCHER: ${LOADLENS_LOAD_TEST_WATCHER:-1}
      # Where reports and Confluence publications run: auto, thread or celery (see docker/env.example).
      LOADLENS_JOB_RUNNER: ${LOADLENS_JOB_RUNNER:-auto}
      # Minutes without a heartbeat after which a worker job is marked as failed.
      LOADLENS_JOB_STALE_MIN: ${LOADLENS_JOB_STALE_MIN:-15}
      LOADLENS_JOB_QUEUE_MAX_MIN: ${LOADLENS_JOB_QUEUE_MAX_MIN:-120}
      # Soft time limit of a report or publication task in the worker, seconds (hard limit 60 s later).
      LOADLENS_REPORT_TASK_LIMIT_SEC: ${LOADLENS_REPORT_TASK_LIMIT_SEC:-3600}
    volumes:
      # Хранение рендеров/картинок между рестартами
      - ../data_collectors/temporary_files:/app/data_collectors/temporary_files
      # Configuration with secrets is mounted from the repository root and never baked into the image
      # (.dockerignore excludes it). Long syntax: a missing file stops `docker compose up` with an error
      # instead of silently turning into a directory. Create the files first (docker/DOCKER_SETUP.md).
      - type: bind
        source: ../settings.py
        target: /app/settings.py
        read_only: true
      - type: bind
        source: ../metrics_config.py
        target: /app/metrics_config.py
        read_only: true
      # Written by the settings page, so changes survive re-creating the container
      - type: bind
        source: ../settings_runtime.json
        target: /app/settings_runtime.json
      - type: bind
        source: ../metrics_config_runtime.json
        target: /app/metrics_config_runtime.json
      # GigaChat mTLS certificate and key (llm.gigachat.cert_file / key_file); may stay empty
      - ../AI/GigaChat:/app/AI/GigaChat:ro
    # Caps for one container; tune them in docker/.env.
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: ${APP_MEMORY_LIMIT:-2g}
          pids: 512
    restart: unless-stopped

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ltar_celery_worker
    depends_on:
      - timescaledb
      - redis
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-0}
      LOADLENS_JOB_RUNNER: ${LOADLENS_JOB_RUNNER:-auto}
      LOADLENS_JOB_STALE_MIN: ${LOADLENS_JOB_STALE_MIN:-15}
      LOADLENS_JOB_QUEUE_MAX_MIN: ${LOADLENS_JOB_QUEUE_MAX_MIN:-120}
      LOADLENS_REPORT_TASK_LIMIT_SEC: ${LOADLENS_REPORT_TASK_LIMIT_SEC:-3600}
    # Builds reports and publications (queue "reports") and runs the remaining tasks (queue "celery").
    # A child process is replaced after 20 tasks: pandas does not give memory back to the system.
    command: celery -A loadlens_app.celery_app worker --loglevel=info -Q reports,celery --concurrency ${WORKER_CONCURRENCY:-2} --max-tasks-per-child 20
    healthcheck:
      # Asks this worker for a pong through the broker; $$ leaves $HOSTNAME to the container shell.
      test: ["CMD-SHELL", "celery -A loadlens_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      - ../data_collectors/temporary_files:/app/data_collectors/temporary_files
      # The worker imports the app package, which reads the same configuration (read-only here).
      - type: bind
        source: ../settings.py
        target: /app/settings.py
        read_only: true
      - type: bind
        source: ../metrics_config.py
        target: /app/metrics_config.py
        read_only: true
      - type: bind
        source: ../settings_runtime.json
        target: /app/settings_runtime.json
        read_only: true
      - type: bind
        source: ../metrics_config_runtime.json
        target: /app/metrics_config_runtime.json
        read_only: true
      # Reports with the GigaChat provider are built here and need the same mTLS certificate and key as the app.
      - ../AI/GigaChat:/app/AI/GigaChat:ro
    # SIGTERM starts a warm shutdown: running reports may finish before the container is killed.
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-1}"
          memory: ${WORKER_MEMORY_LIMIT:-2g}
          pids: 256
    restart: unless-stopped

volumes:
  tsdb_data:
    driver: local
  redis_data:
    driver: local

